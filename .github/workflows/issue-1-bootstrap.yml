name: Smoke test Issue 1 generator

on:
  push:
    branches:
      - issue-1-wikidata-news-sync
    paths:
      - .github/workflows/issue-1-bootstrap.yml

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-1-wikidata-news-sync

      - name: Check PHP and cURL
        run: |
          php -v
          php -m | grep -qi '^curl$' || (sudo apt-get update && sudo apt-get install -y php-curl)
          php -l scripts/news-sync.php

      - name: Generate March 2010
        run: php scripts/news-sync.php 2010-03 --force

      - name: Validate generated JSON and index
        run: |
          php -r '
          $j=json_decode(file_get_contents("data/2010-03.json"), true, 512, JSON_THROW_ON_ERROR);
          if (($j["schema_version"] ?? null) !== 6) { fwrite(STDERR,"schema_version\n"); exit(1); }
          if (count($j["regions"] ?? []) !== 47) { fwrite(STDERR,"regions\n"); exit(1); }
          foreach (($j["regions"] ?? []) as $events) {
              $seen=[];
              foreach ($events as $e) {
                  if (($e["date_precision"] ?? 0) < 10) { fwrite(STDERR,"date_precision\n"); exit(1); }
                  $group=match($e["date_property"] ?? "") { "P585","P580"=>"event", "P1619","P571"=>"opening", "P3999","P576"=>"closure", default=>"unknown" };
                  $key=($e["wikidata_id"] ?? "") . ":" . $group;
                  if (isset($seen[$key])) { fwrite(STDERR,"duplicate {$key}\n"); exit(1); }
                  $seen[$key]=true;
              }
          }
          $index=json_decode(file_get_contents("data/index.json"), true, 512, JSON_THROW_ON_ERROR);
          if (!in_array("2010-03", $index["months"] ?? [], true)) { fwrite(STDERR,"index\n"); exit(1); }
          printf("schema=%d regions=%d events=%d national=%d candidates=%d index=OK\n",
              $j["schema_version"], count($j["regions"]), $j["stats"]["event_count"] ?? -1,
              count($j["national"] ?? []), count($j["national_candidates"] ?? []));
          '
